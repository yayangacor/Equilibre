<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.supabase.co"
    />
    <script>
      // Links made before the landing page existed (tester links ?kode=, dev shortcuts, #dashboard) open the app.
      (function () {
        var q = new URLSearchParams(location.search);
        var appParams = ["kode", "debug", "calib", "window", "tidur", "riwayat", "kamera", "uji", "label"];
        var appHash = /^#(dashboard|insight|insights|tanya|privasi|settings|debug|sekarang|teknis)$/;
        if (appParams.some(function (p) { return q.has(p); }) || appHash.test(location.hash)) {
          location.replace("app.html" + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Equilibre</title>
  </head>
  <body>
    <main id="landing"></main>
    <script type="module" src="/src/landing/landing.ts"></script>
  </body>
</html>
